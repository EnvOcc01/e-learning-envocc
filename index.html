<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>EnvOcc E-Learning</title>

  <link
    rel="icon"
    type="image/x-icon"
    href="./favicon.ico?v=3"
  >

  <link
    rel="shortcut icon"
    type="image/x-icon"
    href="./favicon.ico?v=3"
  >

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }
  </style>
</head>

<body>
  <iframe
    id="envocc-app"
    title="EnvOcc E-Learning"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    const APP_URL =
      'https://script.google.com/macros/s/' +
      'AKfycbyy-gCv5sJf3RUVksXg6HfDpVxmljuq5-LgxBDsHJ-OwXZMsE5fCXE0KXQHmRyZT1wS/' +
      'exec';

    const APP_VERSION = '29';

    const appFrame = document.getElementById(
      'envocc-app'
    );

    let appWindow = null;

    function getRoute() {
      const hash = window.location.hash.replace(
        /^#\/?/,
        ''
      );

      const parts = hash
        .split('/')
        .filter(Boolean);

      if (
        parts[0] === 'course' &&
        parts[1]
      ) {
        return {
          page: 'course',
          slug: decodeURIComponent(
            parts.slice(1).join('/')
          )
        };
      }

      return {
        page: 'home',
        slug: ''
      };
    }

    function sendRoute() {
      if (!appWindow) {
        return;
      }

      const route = getRoute();

      appWindow.postMessage(
        {
          type: 'envocc:route',
          page: route.page,
          slug: route.slug
        },
        '*'
      );
    }

    window.addEventListener(
      'message',
      function (event) {
        let senderHost = '';

        try {
          senderHost =
            new URL(event.origin).hostname;
        } catch (error) {
          return;
        }

        const isGoogleApp =
          senderHost === 'script.google.com' ||
          senderHost.endsWith(
            '.googleusercontent.com'
          );

        if (
          !isGoogleApp ||
          !event.data ||
          !event.data.type
        ) {
          return;
        }

        if (
          event.data.type ===
          'envocc:ready'
        ) {
          appWindow = event.source;
          sendRoute();
          return;
        }

        if (
          event.data.type !==
          'envocc:navigate'
        ) {
          return;
        }

        if (
          event.data.page === 'course' &&
          event.data.slug
        ) {
          window.location.hash =
            '/course/' +
            encodeURIComponent(
              event.data.slug
            );

          return;
        }

        window.location.hash = '/';
      }
    );

    window.addEventListener(
      'hashchange',
      sendRoute
    );

    appFrame.src =
      APP_URL +
      '?v=' +
      APP_VERSION;
  </script>
</body>
</html>
