<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>EnvOcc E-Learning</title>

  <link
    rel="icon"
    type="image/x-icon"
    href="https://envocc01.github.io/e-learning-envocc/favicon.ico?v=3"
  >

  <link
    rel="shortcut icon"
    type="image/x-icon"
    href="https://envocc01.github.io/e-learning-envocc/favicon.ico?v=3"
  >

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }
  </style>
</head>

<body>
  <iframe
    id="envocc-app"
    title="EnvOcc E-Learning"
    allow="clipboard-read; clipboard-write"
  ></iframe>

  <script>
    const APP_URL =
      'https://script.google.com/macros/s/' +
      'AKfycbyy-gCv5sJf3RUVksXg6HfDpVxmljuq5-LgxBDsHJ-OwXZMsE5fCXE0KXQHmRyZT1wS/' +
      'exec';

    const APP_VERSION = '26';

    const appFrame = document.getElementById(
      'envocc-app'
    );

    function getRoute() {
      const hash = window.location.hash.replace(
        /^#\/?/,
        ''
      );

      const parts = hash
        .split('/')
        .filter(Boolean);

      if (
        parts[0] === 'course' &&
        parts[1]
      ) {
        return {
          page: 'course',
          slug: decodeURIComponent(
            parts.slice(1).join('/')
          )
        };
      }

      return {
        page: 'home',
        slug: ''
      };
    }

    function renderRoute() {
      const route = getRoute();

      const destination =
        route.page === 'course'
          ? (
            APP_URL +
            '?course=' +
            encodeURIComponent(route.slug) +
            '&v=' +
            APP_VERSION
          )
          : (
            APP_URL +
            '?v=' +
            APP_VERSION
          );

      if (
        appFrame.dataset.currentUrl !==
        destination
      ) {
        appFrame.dataset.currentUrl =
          destination;

        appFrame.src = destination;
      }
    }

    window.addEventListener(
      'message',
      function (event) {
        let senderHost = '';

        try {
          senderHost =
            new URL(event.origin).hostname;
        } catch (error) {
          return;
        }

        const isGoogleApp =
          senderHost === 'script.google.com' ||
          senderHost.endsWith(
            '.googleusercontent.com'
          );

        if (
          !isGoogleApp ||
          !event.data ||
          event.data.type !==
            'envocc:navigate'
        ) {
          return;
        }

        if (
          event.data.page === 'course' &&
          event.data.slug
        ) {
          window.location.hash =
            '/course/' +
            encodeURIComponent(
              event.data.slug
            );

          return;
        }

        window.location.hash = '/';
      }
    );

    window.addEventListener(
      'hashchange',
      renderRoute
    );

    renderRoute();
  </script>
</body>
</html>
